<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TezBozor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f2f3f5;
    --card:#ffffff;
    --text:#1c1c1e;
    --hint:#8e9199;
    --line:#ececf0;
    --accent:#7000ff;
    --accent-2:#9a4dff;
    --accent-soft:#f1e9ff;
    --price:#1c1c1e;
    --sale:#f5325b;
    --star:#ffb400;
    --ok:#1bbf72;
    --shadow:0 1px 3px rgba(20,20,40,.06), 0 6px 16px rgba(20,20,40,.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  body{padding-bottom:28px; -webkit-font-smoothing:antialiased;}
  img{display:block;}

  /* ---------- TOPBAR ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg);
          padding:10px 12px 6px; box-shadow:0 1px 0 var(--line);}
  .searchwrap{position:relative;}
  .searchwrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5;}
  .search{width:100%; padding:12px 14px 12px 40px; border:none; border-radius:13px;
          font-size:15px; background:var(--card); color:var(--text); outline:none;
          box-shadow:var(--shadow);}
  .search::placeholder{color:var(--hint);}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 12px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; padding:8px 15px; border-radius:20px; background:var(--card);
        font-size:13.5px; font-weight:500; white-space:nowrap; cursor:pointer;
        border:1px solid var(--line); color:var(--text); transition:.15s; user-select:none;}
  .chip:active{transform:scale(.96);}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);
               box-shadow:0 4px 12px rgba(112,0,255,.28);}

  /* ---------- GRID ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 12px;}
  .card{background:var(--card); border-radius:16px; overflow:hidden; cursor:pointer;
        display:flex; flex-direction:column; box-shadow:var(--shadow); position:relative;}
  .card:active{transform:scale(.985);}
  .imgwrap{width:100%; aspect-ratio:1/1; background:#ececed; position:relative; overflow:hidden;}
  .imgwrap img{width:100%; height:100%; object-fit:cover;}
  .ph{display:flex; align-items:center; justify-content:center; height:100%;
      font-size:40px; color:#c7c7cc;}
  .tag{position:absolute; top:8px; left:8px; padding:3px 8px; border-radius:8px;
       font-size:10.5px; font-weight:700; color:#fff; letter-spacing:.3px;}
  .tag.new{background:var(--ok);} .tag.sale{background:var(--sale);}
  .body{padding:9px 10px 11px; display:flex; flex-direction:column; flex:1;}
  .price{font-size:16.5px; font-weight:800; color:var(--price); letter-spacing:-.2px;}
  .oldprice{font-size:12px; color:var(--hint); text-decoration:line-through; margin-left:6px; font-weight:500;}
  .name{font-size:12.5px; line-height:1.3; color:#2c2c30; margin-top:4px; height:2.6em;
        overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .meta{display:flex; align-items:center; gap:5px; margin-top:6px; font-size:11.5px; color:var(--hint);}
  .stars{display:inline-flex; align-items:center; gap:3px; color:#5a5a60; font-weight:600;}
  .stars b{color:var(--star);}
  .shopname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .buy{margin-top:9px; padding:9px; border:none; border-radius:11px; font-size:13px;
       font-weight:700; background:var(--accent-soft); color:var(--accent); cursor:pointer;
       display:flex; align-items:center; justify-content:center; gap:5px; transition:.15s;}
  .buy:active{transform:scale(.97); background:#e6d8ff;}

  /* ---------- SKELETON ---------- */
  .sk{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);}
  .sk .skimg{aspect-ratio:1/1; background:#e9e9ee;}
  .sk .skl{height:11px; border-radius:6px; background:#e9e9ee; margin:9px 10px 0;}
  .shimmer{position:relative; overflow:hidden;}
  .shimmer::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    transform:translateX(-100%); animation:sh 1.3s infinite;}
  @keyframes sh{100%{transform:translateX(100%);}}

  .empty{text-align:center; color:var(--hint); padding:60px 24px; font-size:14.5px; line-height:1.6;}
  .empty .big{font-size:46px; display:block; margin-bottom:10px;}

  /* ---------- DETAIL ---------- */
  .detail{position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto;
          transform:translateX(100%); transition:transform .25s cubic-bezier(.3,.7,.3,1);
          display:flex; flex-direction:column;}
  .detail.open{transform:translateX(0);}
  .dtop{position:sticky; top:0; z-index:5; background:rgba(255,255,255,.86);
        backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px);
        display:flex; align-items:center; gap:6px; padding:11px 12px; box-shadow:0 1px 0 var(--line);}
  .dtop .bk{display:flex; align-items:center; gap:4px; font-size:15px; font-weight:600;
            color:var(--accent); cursor:pointer; padding:4px 6px;}
  .galwrap{background:var(--card);}
  .gallery{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;}
  .gallery::-webkit-scrollbar{display:none;}
  .gallery .slide{flex:0 0 100%; scroll-snap-align:center; height:46vh; max-height:380px;
                  display:flex; align-items:center; justify-content:center; background:var(--card);}
  .gallery .slide img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;}
  .gallery .slide .ph{font-size:64px;}
  .dots{display:flex; justify-content:center; gap:6px; padding:8px 0 2px;}
  .dot{width:6px; height:6px; border-radius:50%; background:#d0d0d6;}
  .dot.on{background:var(--accent); width:18px;}
  .dbody{padding:14px 16px 16px; background:var(--bg);}
  .dcard{background:var(--card); border-radius:16px; padding:14px 15px; box-shadow:var(--shadow);}
  .dprice{font-size:25px; font-weight:800; letter-spacing:-.5px;}
  .doldprice{font-size:15px; color:var(--hint); text-decoration:line-through; margin-left:8px; font-weight:500;}
  .dname{font-size:16.5px; font-weight:600; line-height:1.35; margin:8px 0 2px;}
  .drow{display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap;}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600;
        background:var(--bg); padding:6px 11px; border-radius:10px; color:#4a4a50;}
  .pill b{color:var(--star);}
  .pill.stock{color:var(--ok); background:#e8f8f0;}
  .pill.out{color:var(--sale); background:#fdebef;}
  .dsec{margin-top:14px;}
  .dsec h4{font-size:13px; color:var(--hint); font-weight:600; margin:0 0 6px; text-transform:uppercase; letter-spacing:.4px;}
  .ddesc{font-size:14.5px; line-height:1.55; white-space:pre-wrap; color:#2c2c30;}
  .buybar{position:sticky; bottom:0; margin-top:auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom));
          background:rgba(255,255,255,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
          box-shadow:0 -1px 0 var(--line);}
  .buybar button{width:100%; padding:15px; border:none; border-radius:14px; font-size:16px;
              font-weight:700; color:#fff; cursor:pointer;
              background:linear-gradient(135deg,var(--accent),var(--accent-2));
              box-shadow:0 6px 18px rgba(112,0,255,.32); display:flex; align-items:center;
              justify-content:center; gap:8px; transition:.15s;}
  .buybar button:active{transform:scale(.98);}
  .buybar button:disabled{background:#c9c9d0; box-shadow:none; cursor:not-allowed;}

  /* ---------- CHECKOUT ---------- */
  .checkout{position:fixed; inset:0; background:var(--bg); z-index:60; overflow-y:auto;
            transform:translateY(100%); transition:transform .25s cubic-bezier(.3,.7,.3,1);
            display:flex; flex-direction:column;}
  .checkout.open{transform:translateY(0);}
  .cohead{position:sticky; top:0; z-index:5; background:rgba(255,255,255,.9);
          backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
          display:flex; align-items:center; justify-content:space-between; padding:13px 16px;
          box-shadow:0 1px 0 var(--line); font-size:16px; font-weight:700;}
  .cohead .x{font-size:22px; color:var(--hint); cursor:pointer; line-height:1; padding:0 4px;}
  .cobody{padding:14px 16px; display:flex; flex-direction:column; gap:14px;}
  .coprod{display:flex; gap:12px; align-items:center; background:var(--card);
          border-radius:14px; padding:10px; box-shadow:var(--shadow);}
  .coprod img,.coprod .ph{width:60px; height:60px; border-radius:10px; object-fit:cover;
          background:#ececed; flex:0 0 auto; font-size:28px;}
  .coprod .nm{font-size:13.5px; line-height:1.3; max-height:2.6em; overflow:hidden;}
  .coprod .pr{font-size:15px; font-weight:800; margin-top:3px;}
  .cosec{background:var(--card); border-radius:14px; padding:13px 14px; box-shadow:var(--shadow);}
  .cosec .lbl{font-size:12px; color:var(--hint); font-weight:600; text-transform:uppercase;
              letter-spacing:.4px; margin-bottom:10px;}
  .stepper{display:flex; align-items:center; gap:0; justify-content:space-between;}
  .stepper .qv{font-size:20px; font-weight:800; min-width:50px; text-align:center;}
  .stepbtn{width:42px; height:42px; border-radius:12px; border:none; background:var(--accent-soft);
           color:var(--accent); font-size:24px; font-weight:700; cursor:pointer; line-height:1;
           display:flex; align-items:center; justify-content:center;}
  .stepbtn:active{transform:scale(.93);} .stepbtn:disabled{opacity:.4; cursor:not-allowed;}
  .stockhint{font-size:12px; color:var(--hint); margin-top:8px;}
  .seg{display:flex; gap:8px;}
  .seg .opt{flex:1; padding:12px 8px; border-radius:12px; border:1.5px solid var(--line);
            background:var(--card); text-align:center; font-size:13.5px; font-weight:600;
            cursor:pointer; color:var(--text); transition:.15s;}
  .seg .opt.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
  .seg.col{flex-direction:column;}
  .coaddr{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px;
          font-size:14.5px; font-family:inherit; resize:vertical; min-height:64px; outline:none;
          background:var(--card); color:var(--text); margin-top:10px;}
  .coaddr:focus{border-color:var(--accent);}
  .cobar{position:sticky; bottom:0; margin-top:auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom));
         background:rgba(255,255,255,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
         box-shadow:0 -1px 0 var(--line);}
  .cototal{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px;}
  .cototal .t1{font-size:13px; color:var(--hint);}
  .cototal .t2{font-size:21px; font-weight:800;}
  .cobar button{width:100%; padding:15px; border:none; border-radius:14px; font-size:16px;
            font-weight:700; color:#fff; cursor:pointer;
            background:linear-gradient(135deg,var(--accent),var(--accent-2));
            box-shadow:0 6px 18px rgba(112,0,255,.32); transition:.15s;}
  .cobar button:active{transform:scale(.98);} .cobar button:disabled{background:#c9c9d0; box-shadow:none;}
  .cosuccess{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
             text-align:center; padding:40px 30px; gap:6px;}
  .cosuccess .ico{font-size:72px;} .cosuccess h3{margin:6px 0 0; font-size:20px;}
  .cosuccess p{color:var(--hint); font-size:14.5px; line-height:1.55; margin:4px 0 0;}
  .cosuccess .oid{font-weight:700; color:var(--accent);}

  /* ---------- BOTTOM NAV + VIEWS ---------- */
  body{padding-bottom:72px;}
  .bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
             background:rgba(255,255,255,.94); backdrop-filter:saturate(180%) blur(14px);
             -webkit-backdrop-filter:saturate(180%) blur(14px); box-shadow:0 -1px 0 var(--line);
             padding-bottom:env(safe-area-inset-bottom);}
  .navitem{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
           padding:9px 0 8px; cursor:pointer; color:var(--hint); font-weight:600; user-select:none;}
  .navitem span{font-size:21px; line-height:1; filter:grayscale(1); opacity:.6;}
  .navitem small{font-size:10.5px;}
  .navitem.active{color:var(--accent);} .navitem.active span{filter:none; opacity:1;}
  .navitem:active{transform:scale(.94);}
  .vhead{font-size:21px; font-weight:800; padding:16px 16px 6px; letter-spacing:-.3px;}
  /* buyurtma kartochkalari */
  .olist{padding:6px 12px 12px; display:flex; flex-direction:column; gap:10px;}
  .ocard{background:var(--card); border-radius:16px; padding:13px 14px; box-shadow:var(--shadow);}
  .orow1{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .ostatus{font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:9px;}
  .st-pending{background:#fff4e0; color:#d98300;}
  .st-ok{background:#e8f8f0; color:var(--ok);}
  .st-done{background:#e7f0ff; color:#2563eb;}
  .st-cancel{background:#fdebef; color:var(--sale);}
  .odate{font-size:11.5px; color:var(--hint);}
  .oname{font-size:15px; font-weight:600; line-height:1.3;}
  .ometa{font-size:13.5px; color:#4a4a50; margin-top:4px;}
  .ometa b{color:var(--price); font-weight:800;}
  .oshop{font-size:12.5px; color:var(--hint); margin-top:5px;}
  .odebt{display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700;
         color:var(--sale); background:#fdebef; padding:3px 9px; border-radius:8px;}
  .ocontact{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:11px;
            padding:10px; border:none; border-radius:11px; font-size:13.5px; font-weight:700;
            background:var(--accent-soft); color:var(--accent); cursor:pointer; width:100%;
            text-decoration:none; box-sizing:border-box;}
  .ocontact:active{transform:scale(.98);}
  /* profil */
  .pcard{background:var(--card); border-radius:18px; padding:22px 16px; margin:8px 12px 0;
         box-shadow:var(--shadow); text-align:center;}
  .pava{width:78px; height:78px; border-radius:50%; margin:0 auto 12px; display:flex;
        align-items:center; justify-content:center; font-size:34px; font-weight:800; color:#fff;
        background:linear-gradient(135deg,var(--accent),var(--accent-2));}
  .pname{font-size:19px; font-weight:800;}
  .prole{display:inline-block; margin-top:6px; font-size:12.5px; font-weight:700; color:var(--accent);
         background:var(--accent-soft); padding:4px 12px; border-radius:10px;}
  .pinfo{background:var(--card); border-radius:16px; margin:12px 12px 0; padding:4px 14px; box-shadow:var(--shadow);}
  .prow{display:flex; align-items:center; justify-content:space-between; padding:13px 0;
        font-size:14px; border-bottom:1px solid var(--line);}
  .prow:last-child{border-bottom:none;}
  .prow span{color:var(--hint);} .prow b{font-weight:600; text-align:right;}
  /* sotuvchi buyurtma amallari */
  .oactions{display:flex; gap:8px; margin-top:11px;}
  .oact{flex:1; padding:12px; border:none; border-radius:11px; font-size:13.5px;
        font-weight:700; cursor:pointer;}
  .oact.ok{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
           box-shadow:0 4px 12px rgba(112,0,255,.25);}
  .oact.no{background:#fdebef; color:var(--sale);}
  .oact:active{transform:scale(.97);} .oact:disabled{opacity:.5;}
  /* mahsulot forma rasm tanlash */
  .pfphoto{display:flex; align-items:center; justify-content:center; width:100%; height:190px;
           border-radius:14px; background:var(--card); box-shadow:var(--shadow); overflow:hidden;
           cursor:pointer; border:1.5px dashed #d3d3da;}
  .pfphoto img{width:100%; height:100%; object-fit:cover;}
  .pfedit-hint{font-size:11px; color:var(--hint); margin-top:6px; text-align:center;}
  /* ko'p rasmli galereya */
  .pfimgs{display:flex; gap:8px; flex-wrap:wrap;}
  .pfthumb{position:relative; width:74px; height:74px; border-radius:12px; overflow:hidden;
           box-shadow:var(--shadow); background:#ececed; flex:0 0 auto;}
  .pfthumb img{width:100%; height:100%; object-fit:cover;}
  .pfx{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
       background:rgba(0,0,0,.55); color:#fff; font-size:11px; display:flex; align-items:center;
       justify-content:center; cursor:pointer;}
  .pfmain{position:absolute; bottom:0; left:0; right:0; background:rgba(112,0,255,.85); color:#fff;
          font-size:9px; text-align:center; padding:2px 0; font-weight:700;}
  .pfadd{width:74px; height:74px; border-radius:12px; border:1.5px dashed #c9c9d2; display:flex;
         align-items:center; justify-content:center; cursor:pointer; color:var(--accent);
         font-size:30px; background:var(--card); flex:0 0 auto;}
  /* ---------- SAVAT ---------- */
  .cartfab{position:fixed; right:14px; bottom:84px; z-index:25; cursor:pointer; font-weight:700;
           background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
           border-radius:16px; padding:12px 15px; display:none; align-items:center; gap:9px;
           box-shadow:0 8px 22px rgba(112,0,255,.42);}
  .cartfab .cnt{background:#fff; color:var(--accent); border-radius:10px; padding:1px 8px; font-size:13px;}
  .citem{display:flex; gap:11px; align-items:flex-start; background:var(--card); border-radius:14px;
         padding:10px; box-shadow:var(--shadow);}
  .citem img,.citem .ph{width:58px; height:58px; border-radius:10px; object-fit:cover;
         background:#ececed; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:24px;}
  .citem .nm{font-size:13px; line-height:1.25; max-height:2.5em; overflow:hidden;}
  .citem .pr{font-weight:800; font-size:14px; margin-top:3px;}
  .cqty{display:flex; align-items:center; gap:8px; margin-top:7px;}
  .cqty button{width:30px; height:30px; border-radius:9px; border:none; background:var(--accent-soft);
               color:var(--accent); font-size:18px; font-weight:700; cursor:pointer; line-height:1;}
  .cqty .v{min-width:22px; text-align:center; font-weight:700;}
  .crm{color:var(--sale); font-size:18px; cursor:pointer; padding:2px 4px; line-height:1;}
  .cartempty{text-align:center; color:var(--hint); padding:60px 24px; font-size:14.5px;}
  .cartempty .big{font-size:48px; display:block; margin-bottom:10px;}
  /* ---------- CHAT ---------- */
  #chatview,#aiview{overflow:hidden;}
  .aifab{position:fixed; left:14px; bottom:84px; z-index:25; cursor:pointer; font-weight:700;
         background:linear-gradient(135deg,#7b2ff7,#f107a3); color:#fff; border-radius:16px;
         padding:12px 15px; display:flex; align-items:center; gap:7px; box-shadow:0 8px 22px rgba(123,47,247,.4);}
  .chatwrap{flex:1; overflow-y:auto; padding:14px 14px 10px; display:flex; flex-direction:column; gap:8px;}
  .cbub{max-width:80%; padding:9px 12px; border-radius:15px; font-size:14px; line-height:1.35; word-wrap:break-word; white-space:pre-wrap;}
  .cbub.me{align-self:flex-end; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-bottom-right-radius:5px;}
  .cbub.them{align-self:flex-start; background:var(--card); color:var(--text); box-shadow:var(--shadow); border-bottom-left-radius:5px;}
  .cbub .tm{font-size:10px; opacity:.6; margin-top:3px; text-align:right;}
  .chatbar{display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
           background:rgba(255,255,255,.96); box-shadow:0 -1px 0 var(--line);}
  .chatbar input{flex:1; border:1.5px solid var(--line); border-radius:20px; padding:11px 15px;
                 font-size:14.5px; outline:none; font-family:inherit;}
  .chatbar input:focus{border-color:var(--accent);}
  .chatbar button{width:44px; height:44px; border-radius:50%; border:none; cursor:pointer; flex:0 0 auto;
                  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-size:18px;}
  .chatempty{text-align:center; color:var(--hint); padding:50px 24px; font-size:14px; line-height:1.6;}
  /* ---------- REYTING / QARZ ---------- */
  .stars-pick{display:flex; gap:8px; font-size:34px; cursor:pointer; justify-content:center; padding:4px 0;}
  .stars-pick span{filter:grayscale(1); opacity:.4; transition:.12s;}
  .stars-pick span.on{filter:none; opacity:1; transform:scale(1.05);}
  .debtcard{background:var(--card); border-radius:14px; padding:14px; box-shadow:var(--shadow);
            display:flex; justify-content:space-between; align-items:center;}
  .debtcard .dt{font-weight:800; font-size:16px; color:var(--sale);}
</style>
</head>
<body>
  <div id="viewCatalog">
    <div class="topbar">
      <div class="searchwrap">

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
try{ tg.setHeaderColor('#f2f3f5'); tg.setBackgroundColor('#f2f3f5'); }catch(e){}

const AUTH = "tma " + (tg.initData || "");
let activeCat = null, searchTimer = null, botUsername = null;

async function api(path){
  const r = await fetch(path, {headers:{Authorization: AUTH}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function money(v){ return Math.round(v||0).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm"; }
function imgUrl(fid){ return "/api/image/" + encodeURIComponent(fid); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rating(p){ return (p.prod_avg_rating || p.avg_rating || 0); }
function reviews(p){ return (p.prod_review_count || p.review_count || 0); }
function oldPrice(p){ const o = p.old_price||p.price_old; return (o && o>p.price) ? o : null; }
function isNew(p){
  const d = p.created_at; if(!d) return false;
  const t = Date.parse(String(d).replace(' ','T')+'Z'); if(isNaN(t)) return false;
  return (Date.now()-t) < 7*864e5;
}

function starHtml(p){
  const r = rating(p);
  if(!r) return `<span class="stars" style="color:var(--hint)">Yangi</span>`;
  return `<span class="stars"><b>★</b> ${r.toFixed(1)}</span>`;
}

function cardHtml(p){
  const op = oldPrice(p);
  const img = p.image_url
    ? `<img src="${imgUrl(p.image_url)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=ph>🖼️</div>'">`
    : `<div class="ph">🖼️</div>`;
  let tag = '';
  if(op) tag = `<span class="tag sale">CHEGIRMA</span>`;
  else if(isNew(p)) tag = `<span class="tag new">YANGI</span>`;
  return `<div class="card" data-id="${p.id}">
      <div class="imgwrap">${img}${tag}</div>
      <div class="body">
        <div><span class="price">${money(p.price)}</span>${op?`<span class="oldprice">${money(op)}</span>`:''}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${starHtml(p)} <span class="shopname">${esc(p.shop_name||'')}</span></div>
        <button class="buy" data-cart="${p.id}">➕ Savatga</button>
      </div>
    </div>`;
}

function skeleton(){
  let s='';
  for(let i=0;i<6;i++) s+=`<div class="sk"><div class="skimg shimmer"></div>
    <div class="skl shimmer" style="width:60%"></div>
    <div class="skl shimmer" style="width:85%"></div>
    <div class="skl shimmer" style="width:40%;margin-bottom:11px"></div></div>`;
  return `<div class="grid">${s}</div>`;
}

async function loadCategories(){
  try{
    const cats = await api('/api/categories');
    CATS = cats;
    const chips = document.getElementById('chips');
    chips.innerHTML = `<div class="chip active" data-cat="">Hammasi</div>` +
      cats.map(c=>`<div class="chip" data-cat="${c.id}">${c.emoji||''} ${esc(c.name)}</div>`).join('');
    chips.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      ch.classList.add('active');
      activeCat = ch.dataset.cat || null;
      try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
      loadProducts();
    });
  }catch(e){}
}

async function loadProducts(){
  const content = document.getElementById('content');
  content.innerHTML = skeleton();
  const q = document.getElementById('search').value.trim();
  let url = '/api/products?sort=rating';
  if(q) url += '&q=' + encodeURIComponent(q);
  if(activeCat) url += '&category_id=' + activeCat;
  try{
    const items = await api(url);
    CATALOG_ITEMS = items;
    if(!items.length){
      content.innerHTML = `<div class="empty"><span class="big">🔍</span>Hech narsa topilmadi<br><small>Boshqa so'rov yoki kategoriyani sinab ko'ring</small></div>`;
      return;
    }
    content.innerHTML = `<div class="grid">${items.map(cardHtml).join('')}</div>`;
    content.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
    content.querySelectorAll('[data-cart]').forEach(b=>b.onclick=(e)=>{
      e.stopPropagation();
      const p = CATALOG_ITEMS.find(x=>String(x.id)===b.dataset.cart);
      if(p) cartAdd(p);
    });
  }catch(e){
    content.innerHTML = `<div class="empty"><span class="big">⚠️</span>Xatolik: ${esc(e.message)}<br><small>Mini App'ni Telegram orqali oching.</small></div>`;
  }
}

async function openDetail(id){
  const detail = document.getElementById('detail');
  const body = document.getElementById('detailBody');
  body.innerHTML = `<div class="empty"><span class="big">⏳</span>Yuklanmoqda...</div>`;
  detail.classList.add('open');
  detail.scrollTop = 0;
  try{
    const p = await api('/api/products/'+id);
    const imgs = (p.images && p.images.length) ? p.images : (p.image_url?[p.image_url]:[]);
    const slides = imgs.length
      ? imgs.map(f=>`<div class="slide"><img src="${imgUrl(f)}" onerror="this.parentNode.innerHTML='<div class=ph>🖼️</div>'"></div>`).join('')
      : `<div class="slide"><div class="ph">🖼️</div></div>`;
    const dots = imgs.length>1
      ? `<div class="dots">${imgs.map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('')}</div>` : '';
    const op = oldPrice(p);
    const r = rating(p), rv = reviews(p);
    const stockOk = p.stock_count==null || p.stock_count>0;
    const stockPill = p.stock_count!=null
      ? (p.stock_count>0
          ? `<span class="pill stock">✓ Mavjud: ${p.stock_count} dona</span>`
          : `<span class="pill out">✕ Tugagan</span>`)
      : '';
    body.innerHTML = `
      <div class="galwrap"><div class="gallery" id="gallery">${slides}</div>${dots}</div>
      <div class="dbody">
        <div class="dcard">
          <div><span class="dprice">${money(p.price)}</span>${op?`<span class="doldprice">${money(op)}</span>`:''}</div>
          <div class="dname">${esc(p.name)}</div>
          <div class="drow">
            ${r?`<span class="pill"><b>★</b> ${r.toFixed(1)}${rv?` · ${rv} sharh`:''}</span>`:''}
            <span class="pill">🏪 ${esc(p.shop_name||'')}</span>
            ${stockPill}
          </div>
        </div>
        ${p.description?`<div class="dsec"><h4>Tavsif</h4><div class="dcard"><div class="ddesc">${esc(p.description)}</div></div></div>`:''}
      </div>
      <div class="buybar">
        ${stockOk?`<div style="display:flex;gap:10px">
          <button id="cartBtn" style="flex:0 0 auto;width:56px;background:var(--accent-soft);color:var(--accent);box-shadow:none">➕</button>
          <button id="buyBtn" style="flex:1">🛒 Buyurtma berish</button>
        </div>`:`<button disabled>Hozircha mavjud emas</button>`}
      </div>`;
    if(stockOk){
      document.getElementById('buyBtn').onclick = ()=>openCheckout(p.id);
      document.getElementById('cartBtn').onclick = ()=>{ cartAdd(p); tg.showAlert && null; };
    }
    // dots sinxronlash
    if(imgs.length>1){
      const g = document.getElementById('gallery');
      g.onscroll = ()=>{
        const i = Math.round(g.scrollLeft / g.clientWidth);
        body.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on', j===i));
      };
    }
  }catch(e){
    body.innerHTML = `<div class="empty"><span class="big">⚠️</span>Xatolik: ${esc(e.message)}</div>`;
  }
}

// ---------- LOKATSIYA (Telegram LocationManager yoki brauzer geolocation) ----------
function getLocation(){
  return new Promise((resolve)=>{
    try{
      const lm = tg.LocationManager;
      if(lm && typeof lm.getLocation==='function'){
        const grab=()=>lm.getLocation(d=>resolve(d&&d.latitude?{lat:d.latitude,lon:d.longitude}:null));
        if(lm.isInited) grab(); else lm.init(grab);
        return;
      }
    }catch(e){}
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        p=>resolve({lat:p.coords.latitude, lon:p.coords.longitude}),
        ()=>resolve(null), {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
    } else resolve(null);
  });
}
async function captureLocation(setter, btnId){
  const btn=document.getElementById(btnId); if(btn){ btn.disabled=true; btn.textContent='📍 Olinmoqda...'; }
  const loc=await getLocation();
  if(loc){ setter(loc); try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){} }
  else tg.showAlert("Joylashuvni olib bo'lmadi. Brauzer/Telegram ruxsatini tekshiring yoki manzilni matnda yozing.");
  return loc;
}

// ---------- CHECKOUT (to'liq app ichida) ----------
let coProduct=null, coQty=1, coDelivery='pickup', coPayment='cash', coAddrText='', coLat=null, coLon=null;
const PAYMENTS = [['cash',"💵 Naqd pul"],['terminal',"💳 Terminal (karta)"],['p2p',"📲 Karta raqamiga (P2P)"]];

async function openCheckout(id){
  const co = document.getElementById('checkout');
  const body = document.getElementById('checkoutBody');
  body.innerHTML = `<div class="empty"><span class="big">⏳</span>Yuklanmoqda...</div>`;
  co.classList.add('open'); co.scrollTop = 0;
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
  try{
    coProduct = await api('/api/products/'+id);
    coQty=1; coDelivery='pickup'; coPayment='cash'; coAddrText=''; coLat=null; coLon=null;
    renderCheckout();
  }catch(e){
    body.innerHTML = `<div class="empty"><span class="big">⚠️</span>Xatolik: ${esc(e.message)}</div>`;
  }
}
function coMaxStock(){ return (coProduct && coProduct.stock_count!=null) ? coProduct.stock_count : 999; }

function renderCheckout(){
  const p = coProduct, body = document.getElementById('checkoutBody');
  const img = p.image_url
    ? `<img src="${imgUrl(p.image_url)}" onerror="this.outerHTML='<div class=ph>🖼️</div>'">`
    : `<div class="ph">🖼️</div>`;
  const max = coMaxStock(), total = coQty * Number(p.price||0);
  body.innerHTML = `
    <div class="cobody">
      <div class="coprod">${img}<div><div class="nm">${esc(p.name)}</div><div class="pr">${money(p.price)}</div></div></div>
      <div class="cosec">
        <div class="lbl">Miqdor</div>
        <div class="stepper">
          <button class="stepbtn" id="qMinus" ${coQty<=1?'disabled':''}>−</button>
          <div class="qv">${coQty}</div>
          <button class="stepbtn" id="qPlus" ${coQty>=max?'disabled':''}>+</button>
        </div>
        ${p.stock_count!=null?`<div class="stockhint">Mavjud: ${p.stock_count} dona</div>`:''}
      </div>
      <div class="cosec">
        <div class="lbl">Yetkazib berish</div>
        <div class="seg">
          <div class="opt ${coDelivery==='pickup'?'on':''}" data-dlv="pickup">🚶 Olib ketaman</div>
          <div class="opt ${coDelivery==='delivery'?'on':''}" data-dlv="delivery">🚚 Yetkazib berish</div>
        </div>
        <div id="addrWrap" style="${coDelivery==='delivery'?'':'display:none'}">
          <button class="oact ok" id="coLocBtn" style="width:100%;margin-top:10px;${coLat?'background:#e8f8f0;color:var(--ok)':'background:var(--accent-soft);color:var(--accent)'};box-shadow:none">${coLat?'✓ Joylashuv olindi (qayta olish)':'📍 Joylashuvni yuborish'}</button>
          <textarea class="coaddr" id="coAddr" placeholder="Manzil: ko'cha, uy raqami, mo'ljal...">${esc(coAddrText)}</textarea>
        </div>
      </div>
      <div class="cosec">
        <div class="lbl">To'lov usuli</div>
        <div class="seg col">
          ${PAYMENTS.map(([k,l])=>`<div class="opt ${coPayment===k?'on':''}" data-pay="${k}">${l}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="cobar">
      <div class="cototal"><span class="t1">Jami (${coQty} dona)</span><span class="t2">${money(total)}</span></div>
      <button id="coSubmit">✅ Buyurtmani tasdiqlash</button>
    </div>`;
  body.querySelector('#qMinus').onclick=()=>{ if(coQty>1){coQty--; renderCheckout();} };
  body.querySelector('#qPlus').onclick=()=>{ if(coQty<coMaxStock()){coQty++; renderCheckout();} };
  body.querySelectorAll('[data-dlv]').forEach(o=>o.onclick=()=>{ coDelivery=o.dataset.dlv; renderCheckout(); });
  body.querySelectorAll('[data-pay]').forEach(o=>o.onclick=()=>{ coPayment=o.dataset.pay; renderCheckout(); });
  const addr = body.querySelector('#coAddr');
  if(addr) addr.oninput=()=>{ coAddrText = addr.value; };
  const locBtn = body.querySelector('#coLocBtn');
  if(locBtn) locBtn.onclick = async()=>{ await captureLocation(l=>{ coLat=l.lat; coLon=l.lon; }, 'coLocBtn'); renderCheckout(); };
  body.querySelector('#coSubmit').onclick = submitOrder;
}

async function submitOrder(){
  const btn = document.getElementById('coSubmit');
  if(coDelivery==='delivery' && !(coAddrText||'').trim()){
    tg.showAlert("Yetkazib berish uchun manzilni kiriting."); return;
  }
  btn.disabled = true; btn.textContent = 'Yuborilmoqda...';
  try{
    const r = await fetch('/api/order', {
      method:'POST', headers:{Authorization:AUTH,'Content-Type':'application/json'},
      body: JSON.stringify({
        product_id: coProduct.id, quantity: coQty,
        delivery_type: coDelivery, payment_method: coPayment,
        address: coDelivery==='delivery' ? coAddrText.trim() : null,
        lat: coDelivery==='delivery' ? coLat : null,
        lon: coDelivery==='delivery' ? coLon : null
      })
    });
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
    const res = await r.json();
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    showOrderSuccess(res.order_id);
  }catch(e){
    btn.disabled=false; btn.textContent='✅ Buyurtmani tasdiqlash';
    tg.showAlert("Buyurtma berilmadi: "+e.message);
  }
}

function showOrderSuccess(oid){
  coAddrText='';
  document.getElementById('checkoutBody').innerHTML = `
    <div class="cosuccess">
      <div class="ico">🎉</div>
      <h3>Buyurtma qabul qilindi!</h3>
      <p>Raqamingiz: <span class="oid">#${oid}</span><br>Sotuvchi tez orada siz bilan bog'lanadi.</p>
      <div style="width:100%;margin-top:26px">
        <button class="stepbtn" style="width:100%;height:auto;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(112,0,255,.32)" onclick="closeCheckout(); closeDetail();">Katalogga qaytish</button>
      </div>
    </div>`;
}

function closeCheckout(){ document.getElementById('checkout').classList.remove('open'); }
document.getElementById('coClose').onclick = closeCheckout;

// ---------- SAVAT (client-side, bitta sotuvchi) ----------
let CART = _loadCart(), CATALOG_ITEMS = [], kDlv='pickup', kPay='cash', kAddr='', kLat=null, kLon=null;
function _loadCart(){ try{ return JSON.parse(localStorage.getItem('tb_cart')||'null') || {seller_id:null,seller_name:'',items:{}}; }catch(e){ return {seller_id:null,seller_name:'',items:{}}; } }
function _saveCart(){ try{ localStorage.setItem('tb_cart', JSON.stringify(CART)); }catch(e){} updateCartFab(); }
function cartCount(){ return Object.values(CART.items).reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return Object.values(CART.items).reduce((s,i)=>s+i.qty*Number(i.price||0),0); }
function updateCartFab(){
  const fab=document.getElementById('cartFab'); if(!fab) return;
  const n=cartCount(); document.getElementById('cartFabCnt').textContent=n; fab.style.display=n>0?'flex':'none';
}
function _cartPut(p){
  const k=String(p.id);
  if(CART.items[k]) CART.items[k].qty++;
  else CART.items[k]={qty:1, name:p.name, price:p.price, image:p.image_url||null};
  CART.seller_id=p.seller_id; CART.seller_name=p.shop_name||CART.seller_name;
  _saveCart();
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
}
function cartAdd(p){
  if(p.seller_id==null){ tg.showAlert("Mahsulot ma'lumoti to'liq emas."); return; }
  if(CART.seller_id && CART.seller_id!==p.seller_id && cartCount()>0){
    const sw=()=>{ CART={seller_id:p.seller_id,seller_name:p.shop_name||'',items:{}}; _cartPut(p); };
    if(tg.showConfirm) tg.showConfirm("Savatda boshqa do'kon mahsuloti bor. Tozalab, yangi do'kondan boshlaymizmi?", ok=>{ if(ok) sw(); });
    else if(confirm("Boshqa do'kon — savat tozalansinmi?")) sw();
    return;
  }
  _cartPut(p);
}
function cartSetQty(pid,d){
  const k=String(pid); if(!CART.items[k]) return;
  CART.items[k].qty += d;
  if(CART.items[k].qty<=0) delete CART.items[k];
  if(cartCount()===0){ CART.seller_id=null; CART.seller_name=''; }
  _saveCart(); renderCart();
}
function cartRemove(pid){ delete CART.items[String(pid)]; if(cartCount()===0){CART.seller_id=null;CART.seller_name='';} _saveCart(); renderCart(); }

function openCart(){ kDlv='pickup'; kPay='cash'; kAddr=''; kLat=null; kLon=null; renderCart(); document.getElementById('cartview').classList.add('open'); document.getElementById('cartview').scrollTop=0; }
function closeCart(){ document.getElementById('cartview').classList.remove('open'); }

function renderCart(){
  const body=document.getElementById('cartBody');
  const items=Object.entries(CART.items);
  if(!items.length){ body.innerHTML=`<div class="cartempty"><span class="big">🛒</span>Savat bo'sh<br><small>Katalogdan mahsulot qo'shing</small></div>`; return; }
  const rows=items.map(([pid,it])=>{

async function loadChat(){

    chatMe=d.me;

const ORDER_STATUS = {
  pending:  ["⏳ Yangi","st-pending"],
  confirmed:["✅ Tasdiqlangan","st-ok"],
  delivered:["🚚 Yetkazildi","st-done"],
  cancelled:["❌ Bekor qilindi","st-cancel"],
};
function fmtDate(s){
  if(!s) return '';
  const d = new Date(String(s).replace(' ','T')+'Z');
  if(isNaN(d.getTime())) return String(s).slice(0,16);
  return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function orderCardHtml(o){

  else if(o.seller_phone)
    contact = `<a class="ocontact" href="tel:${esc(o.seller_phone)}">📞 ${esc(o.seller_phone)}</a>`;
  return `<div class="ocard">
    <div class="orow1"><span class="ostatus ${st[1]}">${st[0]}</span><span class="odate">${fmtDate(o.created_at)}</span></div>
    <div class="oname">${esc(o.product_name||'')}</div>

  renderProfileEdit();
  document.getElementById('meform').classList.add('open');
}
function renderProfileEdit(){
  const body = document.getElementById('meformBody');
  body.innerHTML = `<div class="cobody">
    <div class="cosec"><div class="lbl">Ism</div>
      <input class="coaddr" id="meName" style="min-height:auto" placeholder="Ismingiz" value="${esc(meForm.name)}"></div>
    <div class="cosec"><div class="lbl">Telefon</div>
      <input class="coaddr" id="mePhone" type="tel" inputmode="tel" style="min-height:auto" placeholder="998901234567" value="${esc(meForm.phone)}"></div>
    <div class="cosec"><div class="lbl">Til</div>
      <div class="seg">
        <div class="opt ${meForm.language==='uz'?'on':''}" data-lng="uz">🇺🇿 O‘zbekcha</div>
        <div class="opt ${meForm.language==='ru'?'on':''}" data-lng="ru">🇷🇺 Русский</div>
      </div></div>
  </div>
  <div class="cobar"><button id="meSave">💾 Saqlash</button></div>`;
  document.getElementById('meName').oninput = e=>meForm.name=e.target.value;
  document.getElementById('mePhone').oninput = e=>meForm.phone=e.target.value;
  body.querySelectorAll('[data-lng]').forEach(o=>o.onclick=()=>{ meForm.language=o.dataset.lng; renderProfileEdit(); });
  document.getElementById('meSave').onclick = saveProfile;
}
async function saveProfile(){
  const btn = document.getElementById('meSave');
  if(!(meForm.name||'').trim()){ tg.showAlert("Ismingizni kiriting."); return; }
  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  try{
    const r = await fetch('/api/me', {method:'PATCH', headers:{Authorization:AUTH,'Content-Type':'application/json'},
      body: JSON.stringify({name: meForm.name.trim(), phone: (meForm.phone||'').trim(), language: meForm.language})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    closeProfileEdit(); loadProfile();
  }catch(e){ btn.disabled=false; btn.textContent='💾 Saqlash'; tg.showAlert("Saqlanmadi: "+e.message); }
}
function closeProfileEdit(){ document.getElementById('meform').classList.remove('open'); }
document.getElementById('meClose').onclick = closeProfileEdit;

// ---------- SOTUVCHI PANELI (Do'kon) ----------
let ME = null, sellerSub = 'orders', CATS = [], SELLER_PRODUCTS = [], pf = {}, BOT_USERNAME = null;

async function loadMe(){
  try{ ME = await api('/api/me'); }catch(e){ ME = null; }
  try{ if(!BOT_USERNAME){ BOT_USERNAME = (await api('/api/config')).bot_username; } }catch(e){}
  if(ME && (ME.role==='seller' || ME.role==='admin'))
    document.getElementById('navSeller').style.display = '';
}

function shareReferral(code){
  const link = BOT_USERNAME ? `https://t.me/${BOT_USERNAME}?start=${code}` : null;
  if(!link){ tg.showAlert("Havola tayyor emas, birozdan keyin urinib ko'ring."); return; }
  const txt = "TezBozor — onlayn bozor! Mana havolam orqali qo'shiling:";
  try{ tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt)}`); }
  catch(e){ tg.showAlert(link); }
}

function becomeSeller(){
  const doIt=async()=>{
    try{
      const r=await fetch('/api/become-seller',{method:'POST',headers:{Authorization:AUTH}});
      if(!r.ok){ const d=await r.json().catch(()=>({}));
        if(d.detail==='already_pending'){ tg.showAlert("Arizangiz allaqachon ko'rib chiqilmoqda."); return; }
        if(d.detail==='already_seller'){ tg.showAlert("Siz allaqachon sotuvchisiz."); return; }
        throw new Error(d.detail||('HTTP '+r.status)); }
      try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
      tg.showAlert("✅ Ariza yuborildi! Admin ko'rib chiqadi.");
    }catch(e){ tg.showAlert("Xatolik: "+e.message); }
  };
  if(tg.showConfirm) tg.showConfirm("Sotuvchi bo'lish uchun ariza yuborilsinmi?", ok=>{ if(ok) doIt(); });
  else doIt();
}

function openContact(){
  const body=document.getElementById('contactBody');
  body.innerHTML=`<div class="cobody">
    <div style="font-size:13px;color:var(--hint)">Savol yoki muammoyingizni yozing — admin javob beradi.</div>
    <textarea class="coaddr" id="caText" style="min-height:120px" placeholder="Xabaringiz..."></textarea>
  </div><div class="cobar"><button id="caSend">📨 Yuborish</button></div>`;
  document.getElementById('caSend').onclick=sendContact;
  document.getElementById('contactform').classList.add('open');
}
async function sendContact(){
  const text=(document.getElementById('caText').value||'').trim();
  if(!text){ tg.showAlert("Xabar yozing."); return; }
  const btn=document.getElementById('caSend'); btn.disabled=true; btn.textContent='Yuborilmoqda...';
  try{
    const r=await fetch('/api/contact-admin',{method:'POST',headers:{Authorization:AUTH,'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    document.getElementById('contactform').classList.remove('open');
    tg.showAlert("✅ Xabaringiz adminga yuborildi.");
  }catch(e){ btn.disabled=false; btn.textContent='📨 Yuborish'; tg.showAlert("Yuborilmadi: "+e.message); }
}
function closeContact(){ document.getElementById('contactform').classList.remove('open'); }
document.getElementById('caClose').onclick = closeContact;

// ---------- AI YORDAMCHI ----------
let aiMsgs=[];
function openAI(){
  document.getElementById('aiview').classList.add('open');
  if(!aiMsgs.length) aiMsgs=[{role:'ai', text:"Salom! Men TezBozor AI yordamchisiman 🤖\nQanday mahsulot qidiryapsiz? Masalan: «arzon telefon» yoki «bolalar uchun sovg'a»."}];
  renderAI();
  try{ document.getElementById('aiInp').focus(); }catch(e){}
}
function aiBubble(m){
  const cls=m.role==='user'?'me':'them';
  let prods='';
  if(m.products && m.products.length){
    prods=`<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">`+m.products.slice(0,6).map(p=>
      `<div class="citem" data-aiprod="${p.id}" style="cursor:pointer;padding:8px">${p.image_url?`<img src="${imgUrl(p.image_url)}">`:`<div class="ph">🖼️</div>`}<div style="flex:1;min-width:0"><div class="nm">${esc(p.name||'')}</div><div class="pr">${money(p.price)}</div><div style="font-size:11px;color:var(--hint)">${esc(p.shop_name||'')}</div></div><button class="buy" data-aicart="${p.id}" style="width:auto;padding:8px 11px;margin:0">➕</button></div>`).join('')+`</div>`;
  }
  return `<div class="cbub ${cls}" style="max-width:92%">${esc(m.text||'').replace(/\n/g,'<br>')}${prods}</div>`;
}
function renderAI(){
  const wrap=document.getElementById('aiWrap');
  wrap.innerHTML=aiMsgs.map(aiBubble).join('');
  wrap.querySelectorAll('[data-aiprod]').forEach(el=>el.onclick=(e)=>{ if(e.target.closest('[data-aicart]')) return; openDetail(el.dataset.aiprod); });
  wrap.querySelectorAll('[data-aicart]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); aiAddCart(b.dataset.aicart); });
  wrap.scrollTop=wrap.scrollHeight;
}
function aiAddCart(pid){
  let p=null;
  for(let i=aiMsgs.length-1;i>=0;i--){ if(aiMsgs[i].products){ const f=aiMsgs[i].products.find(x=>String(x.id)===String(pid)); if(f){p=f;break;} } }
  if(p) cartAdd(p);
}
async function aiSend(){
  const inp=document.getElementById('aiInp'); const text=(inp.value||'').trim(); if(!text) return;
  inp.value='';
  aiMsgs.push({role:'user', text}); aiMsgs.push({role:'ai', text:'⌛ ...'});
  renderAI();
  const idx=aiMsgs.length-1;
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{Authorization:AUTH,'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail==='ai_disabled'?"AI hozircha sozlanmagan (admin DEEPSEEK_API_KEY).":(d.detail||('HTTP '+r.status))); }
    const res=await r.json();
    aiMsgs[idx]={role:'ai', text:res.text||'', products:res.products||null};
  }catch(e){ aiMsgs[idx]={role:'ai', text:"⚠️ "+e.message}; }
  renderAI();
}
function closeAI(){ document.getElementById('aiview').classList.remove('open'); }
document.getElementById('aiClose').onclick=closeAI;
document.getElementById('aiFab').onclick=openAI;
document.getElementById('aiSendBtn').onclick=aiSend;
document.getElementById('aiInp').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); aiSend(); }});

function loadSeller(){
  const v = document.getElementById('viewSeller');
  v.innerHTML = `<div class="vhead">Do'konim</div>
    <div class="seg" style="margin:0 12px 6px">
      <div class="opt ${sellerSub==='orders'?'on':''}" data-sub="orders">📥 Buyurtmalar</div>
      <div class="opt ${sellerSub==='products'?'on':''}" data-sub="products">📦 Mahsulotlar</div>
    </div>
    <div id="sellerBody"></div>`;
  v.querySelectorAll('[data-sub]').forEach(o=>o.onclick=()=>{ sellerSub=o.dataset.sub; loadSeller(); });
  if(sellerSub==='orders') loadSellerOrders(); else loadSellerProducts();
}

function sellerOrderCard(o){
  const st = ORDER_STATUS[o.status] || [esc(o.status||'?'),'st-pending'];
  const dlv = o.delivery_type==='delivery' ? '🚚 Yetkazib berish' : '🚶 Olib ketish';
  const contact = o.buyer_phone ? `<a class="ocontact" href="tel:${esc(o.buyer_phone)}">📞 ${esc(o.buyer_phone)}</a>` : '';
  const actions = o.status==='pending'
    ? `<div class="oactions">
         <button class="oact ok" data-oid="${o.id}" data-act="confirm">✅ Tasdiqlash</button>
         <button class="oact no" data-oid="${o.id}" data-act="reject">❌ Rad etish</button>
       </div>` : '';
  return `<div class="ocard">
    <div class="orow1"><span class="ostatus ${st[1]}">${st[0]}</span><span class="odate">${fmtDate(o.created_at)}</span></div>
    <div class="oname">${esc(o.product_name||'')}</div>
    <div class="ometa">${o.quantity} dona · <b>${money(o.total_price)}</b></div>
    <div class="oshop">👤 ${esc(o.buyer_name||'')} · ${dlv}</div>
    ${o.delivery_address?`<div class="oshop">📍 ${esc(o.delivery_address)}</div>`:''}
    ${contact}
    <button class="ocontact" data-chat="${o.id}" style="margin-top:8px;background:var(--bg);color:var(--accent)">💬 Xabar</button>
    ${actions}
  </div>`;
}

async function loadSellerOrders(){
  const b = document.getElementById('sellerBody');
  b.innerHTML = `<div class="loading">Yuklanmoqda...</div>`;
  try{
    const orders = await api('/api/seller/orders');
    if(!orders.length){ b.innerHTML = `<div class="empty"><span class="big">📥</span>Hali buyurtma yo'q</div>`; return; }
    b.innerHTML = `<div class="olist">${orders.map(sellerOrderCard).join('')}</div>`;
    b.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>sellerOrderAction(btn.dataset.oid, btn.dataset.act, btn));
    b.querySelectorAll('[data-chat]').forEach(btn=>btn.onclick=()=>openChat(btn.dataset.chat));
  }catch(e){ b.innerHTML = `<div class="empty"><span class="big">⚠️</span>${esc(e.message)}</div>`; }
}

async function sellerOrderAction(oid, action, btn){
  const card = btn.closest('.ocard');
  card.querySelectorAll('.oact').forEach(x=>x.disabled=true);
  btn.textContent = '...';
  try{
    const r = await fetch(`/api/seller/order/${oid}/action`, {
      method:'POST', headers:{Authorization:AUTH,'Content-Type':'application/json'},
      body: JSON.stringify({action})
    });
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
  }catch(e){ tg.showAlert("Xatolik: "+e.message); }
  loadSellerOrders();
}

function sellerProductCard(p){
  const img = p.image_url ? `<img src="${imgUrl(p.image_url)}" onerror="this.outerHTML='<div class=ph>🖼️</div>'">` : `<div class="ph">🖼️</div>`;
  const stock = p.stock_count==null ? 'Cheksiz zahira' : (p.stock_count>0?`${p.stock_count} dona`:'Tugagan');
  const hidden = p.in_stock ? '' : ` <span class="ostatus st-cancel">Yashirin</span>`;
  return `<div class="ocard" data-pid="${p.id}" style="display:flex;gap:12px;align-items:center;cursor:pointer">
    <div class="coprod" style="padding:0;background:none;box-shadow:none;flex:0 0 auto">${img}</div>
    <div style="flex:1;min-width:0">
      <div class="oname" style="font-size:14px">${esc(p.name||'')}</div>
      <div class="ometa"><b>${money(p.price)}</b></div>
      <div class="oshop">📦 ${stock}${hidden}</div>
    </div>
    <span style="color:var(--hint);font-size:20px">›</span>
  </div>`;
}

async function loadSellerProducts(){
  const b = document.getElementById('sellerBody');
  b.innerHTML = `<div class="loading">Yuklanmoqda...</div>`;
  try{
    const prods = await api('/api/seller/products');
    SELLER_PRODUCTS = prods;
    const addBtn = `<div style="padding:8px 12px 4px"><button class="oact ok" id="pfAddBtn" style="width:100%">➕ Mahsulot qo'shish</button></div>`;
    if(!prods.length){
      b.innerHTML = addBtn + `<div class="empty"><span class="big">📦</span>Hali mahsulot yo'q</div>`;
    }else{
      b.innerHTML = addBtn + `<div class="olist">${prods.map(sellerProductCard).join('')}</div>`;
    }
    document.getElementById('pfAddBtn').onclick = ()=>openProductForm(null);
    b.querySelectorAll('.ocard[data-pid]').forEach(c=>c.onclick=()=>{
      const p = SELLER_PRODUCTS.find(x=>String(x.id)===c.dataset.pid);
      if(p) openProductForm(p);
    });
  }catch(e){ b.innerHTML = `<div class="empty"><span class="big">⚠️</span>${esc(e.message)}</div>`; }
}

// ---------- MAHSULOT FORMASI (qo'shish / tahrirlash) ----------
function openProductForm(prod){
  pf = prod ? {
    id: prod.id, name: prod.name||'', price: prod.price||'', category_id: prod.category_id||null,
    description: prod.description||'', stock_count: (prod.stock_count==null?'':prod.stock_count),
    images: prod.image_url ? [prod.image_url] : [], in_stock: prod.in_stock
  } : { id:null, name:'', price:'', category_id:null, description:'', stock_count:'', images:[] };
  document.getElementById('pfTitle').textContent = pf.id ? 'Mahsulotni tahrirlash' : 'Yangi mahsulot';
  renderProductForm();
  document.getElementById('prodform').classList.add('open');
  document.getElementById('prodform').scrollTop = 0;
  // Tahrirda to'liq galereyani fon'da yuklaymiz (bir nechta rasm bo'lsa)
  if(prod) api('/api/products/'+prod.id).then(d=>{
    if(d && Array.isArray(d.images) && d.images.length){ pf.images = d.images.slice(0,4); renderProductForm(); }
  }).catch(()=>{});
}

function renderProductForm(){
  const body = document.getElementById('prodformBody');
  const isEdit = !!pf.id;
  const thumbs = pf.images.map((fid,i)=>
    `<div class="pfthumb"><img src="${imgUrl(fid)}"><span class="pfx" data-rm="${i}">✕</span>${i===0?'<span class="pfmain">Asosiy</span>':''}</div>`).join('');
  const addTile = pf.images.length<4
    ? `<label class="pfadd">＋<input type="file" id="pfFile" accept="image/*" style="display:none"></label>` : '';
  body.innerHTML = `<div class="cobody">
    <div class="cosec"><div class="lbl">Rasmlar (${pf.images.length}/4 — 1-chi asosiy)</div>
      <div class="pfimgs">${thumbs}${addTile}</div>
    </div>
    <div class="cosec"><div class="lbl">Nomi</div>
      <input class="coaddr" id="pfName" style="min-height:auto" placeholder="Mahsulot nomi" value="${esc(pf.name)}"></div>
    <div class="cosec"><div class="lbl">Narxi (so'm)</div>
      <input class="coaddr" id="pfPrice" type="number" inputmode="numeric" style="min-height:auto" placeholder="0" value="${esc(String(pf.price))}"></div>
    <div class="cosec"><div class="lbl">Kategoriya</div>
      <div class="chips" id="pfCats" style="padding:0;flex-wrap:wrap">${CATS.map(c=>`<div class="chip ${pf.category_id==c.id?'active':''}" data-cid="${c.id}">${c.emoji||''} ${esc(c.name)}</div>`).join('')}</div></div>
    <div class="cosec"><div class="lbl">Zahira (bo'sh = cheksiz)</div>
      <input class="coaddr" id="pfStock" type="number" inputmode="numeric" style="min-height:auto" placeholder="Cheksiz" value="${esc(String(pf.stock_count))}"></div>
    <div class="cosec"><div class="lbl">Tavsif</div>
      <textarea class="coaddr" id="pfDesc" placeholder="Mahsulot haqida...">${esc(pf.description)}</textarea></div>
    ${isEdit?`<button class="oact no" id="pfToggle" style="width:100%">${pf.in_stock?'🙈 Sotuvdan yashirish':'👁 Sotuvga qaytarish'}</button>
              <button class="oact no" id="pfDelete" style="width:100%;background:#fdebef;color:var(--sale)">🗑 O'chirish</button>`:''}
  </div>
  <div class="cobar"><button id="pfSave">${isEdit?'💾 Saqlash':"➕ Qo'shish"}</button></div>`;

  const fileInp = document.getElementById('pfFile'); if(fileInp) fileInp.onchange = onPhotoPick;
  body.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{ pf.images.splice(Number(x.dataset.rm),1); renderProductForm(); });
  document.getElementById('pfName').oninput = e=>pf.name=e.target.value;
  document.getElementById('pfPrice').oninput = e=>pf.price=e.target.value;
  document.getElementById('pfStock').oninput = e=>pf.stock_count=e.target.value;
  document.getElementById('pfDesc').oninput = e=>pf.description=e.target.value;
  body.querySelectorAll('[data-cid]').forEach(ch=>ch.onclick=()=>{
    pf.category_id = Number(ch.dataset.cid);
    body.querySelectorAll('#pfCats .chip').forEach(x=>x.classList.toggle('active', x.dataset.cid==pf.category_id));
  });
  document.getElementById('pfSave').onclick = saveProduct;
  const tgl = document.getElementById('pfToggle'); if(tgl) tgl.onclick = toggleProductVisibility;
  const del = document.getElementById('pfDelete'); if(del) del.onclick = confirmDeleteProduct;
}

async function onPhotoPick(e){
  const f = e.target.files[0]; if(!f) return;
  const add = document.querySelector('.pfadd');
  if(add) add.innerHTML = `<div class="loading" style="padding:0;font-size:18px">⏳</div>`;
  const fd = new FormData(); fd.append('file', f);
  try{
    const r = await fetch('/api/seller/product/photo', {method:'POST', headers:{Authorization:AUTH}, body:fd});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
    pf.images.push((await r.json()).file_id);
  }catch(err){ tg.showAlert("Rasm yuklanmadi: "+err.message); }
  renderProductForm();
}

async function saveProduct(){
  const btn = document.getElementById('pfSave');
  if(!(pf.name||'').trim()){ tg.showAlert("Mahsulot nomini kiriting."); return; }
  const price = Number(pf.price);
  if(!price || price<=0){ tg.showAlert("To'g'ri narx kiriting."); return; }
  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  const payload = {
    name: pf.name.trim(), price: price,
    category_id: pf.category_id || null,
    description: (pf.description||'').trim() || null,
    stock_count: (pf.stock_count===''||pf.stock_count==null) ? null : Number(pf.stock_count),
    images: pf.images || [],
  };
  try{
    const url = pf.id ? '/api/seller/product/'+pf.id : '/api/seller/product';
    const method = pf.id ? 'PATCH' : 'POST';
    const r = await fetch(url, {method, headers:{Authorization:AUTH,'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||('HTTP '+r.status)); }
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    closeProductForm(); loadSellerProducts();
  }catch(e){
    btn.disabled=false; btn.textContent = pf.id?'💾 Saqlash':"➕ Qo'shish";
    tg.showAlert("Saqlanmadi: "+e.message);
  }
}

async function toggleProductVisibility(){
  try{
    const r = await fetch('/api/seller/product/'+pf.id+'/toggle', {method:'POST', headers:{Authorization:AUTH}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    closeProductForm(); loadSellerProducts();
  }catch(e){ tg.showAlert("Xatolik: "+e.message); }
}

function confirmDeleteProduct(){
  const doDel = async()=>{
    try{
      const r = await fetch('/api/seller/product/'+pf.id, {method:'DELETE', headers:{Authorization:AUTH}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      closeProductForm(); loadSellerProducts();
    }catch(e){ tg.showAlert("O'chirilmadi: "+e.message); }
  };
  if(tg.showConfirm) tg.showConfirm("Mahsulot butunlay o'chirilsinmi?", ok=>{ if(ok) doDel(); });
  else if(confirm("O'chirilsinmi?")) doDel();
}

function closeProductForm(){ document.getElementById('prodform').classList.remove('open'); }
document.getElementById('pfClose').onclick = closeProductForm;

loadMe();
loadCategories();
loadProducts();
</script>
