<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TezBozor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f2f3f5;
    --card:#ffffff;
    --text:#1c1c1e;
    --hint:#8e9199;
    --line:#ececf0;
    --accent:#7000ff;
    --accent-2:#9a4dff;
    --accent-soft:#f1e9ff;
    --price:#1c1c1e;
    --sale:#f5325b;
    --star:#ffb400;
    --ok:#1bbf72;
    --shadow:0 1px 3px rgba(20,20,40,.06), 0 6px 16px rgba(20,20,40,.05);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
  body{padding-bottom:28px; -webkit-font-smoothing:antialiased;}
  img{display:block;}

  /* ---------- TOPBAR ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg);
          padding:10px 12px 6px; box-shadow:0 1px 0 var(--line);}
  .searchwrap{position:relative;}
  .searchwrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5;}
  .search{width:100%; padding:12px 14px 12px 40px; border:none; border-radius:13px;
          font-size:15px; background:var(--card); color:var(--text); outline:none;
          box-shadow:var(--shadow);}
  .search::placeholder{color:var(--hint);}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 12px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; padding:8px 15px; border-radius:20px; background:var(--card);
        font-size:13.5px; font-weight:500; white-space:nowrap; cursor:pointer;
        border:1px solid var(--line); color:var(--text); transition:.15s; user-select:none;}
  .chip:active{transform:scale(.96);}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);
               box-shadow:0 4px 12px rgba(112,0,255,.28);}

  /* ---------- GRID ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 12px;}
  .card{background:var(--card); border-radius:16px; overflow:hidden; cursor:pointer;
        display:flex; flex-direction:column; box-shadow:var(--shadow); position:relative;}
  .card:active{transform:scale(.985);}
  .imgwrap{width:100%; aspect-ratio:1/1; background:#ececed; position:relative; overflow:hidden;}
  .imgwrap img{width:100%; height:100%; object-fit:cover;}
  .ph{display:flex; align-items:center; justify-content:center; height:100%;
      font-size:40px; color:#c7c7cc;}
  .tag{position:absolute; top:8px; left:8px; padding:3px 8px; border-radius:8px;
       font-size:10.5px; font-weight:700; color:#fff; letter-spacing:.3px;}
  .tag.new{background:var(--ok);} .tag.sale{background:var(--sale);}
  .body{padding:9px 10px 11px; display:flex; flex-direction:column; flex:1;}
  .price{font-size:16.5px; font-weight:800; color:var(--price); letter-spacing:-.2px;}
  .oldprice{font-size:12px; color:var(--hint); text-decoration:line-through; margin-left:6px; font-weight:500;}
  .name{font-size:12.5px; line-height:1.3; color:#2c2c30; margin-top:4px; height:2.6em;
        overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .meta{display:flex; align-items:center; gap:5px; margin-top:6px; font-size:11.5px; color:var(--hint);}
  .stars{display:inline-flex; align-items:center; gap:3px; color:#5a5a60; font-weight:600;}
  .stars b{color:var(--star);}
  .shopname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .buy{margin-top:9px; padding:9px; border:none; border-radius:11px; font-size:13px;
       font-weight:700; background:var(--accent-soft); color:var(--accent); cursor:pointer;
       display:flex; align-items:center; justify-content:center; gap:5px; transition:.15s;}
  .buy:active{transform:scale(.97); background:#e6d8ff;}

  /* ---------- SKELETON ---------- */
  .sk{background:var(--card); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);}
  .sk .skimg{aspect-ratio:1/1; background:#e9e9ee;}
  .sk .skl{height:11px; border-radius:6px; background:#e9e9ee; margin:9px 10px 0;}
  .shimmer{position:relative; overflow:hidden;}
  .shimmer::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
    transform:translateX(-100%); animation:sh 1.3s infinite;}
  @keyframes sh{100%{transform:translateX(100%);}}

  .empty{text-align:center; color:var(--hint); padding:60px 24px; font-size:14.5px; line-height:1.6;}
  .empty .big{font-size:46px; display:block; margin-bottom:10px;}

  /* ---------- DETAIL ---------- */
  .detail{position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto;
          transform:translateX(100%); transition:transform .25s cubic-bezier(.3,.7,.3,1);
          display:flex; flex-direction:column;}
  .detail.open{transform:translateX(0);}
  .dtop{position:sticky; top:0; z-index:5; background:rgba(255,255,255,.86);
        backdrop-filter:saturate(180%) blur(12px); -webkit-backdrop-filter:saturate(180%) blur(12px);
        display:flex; align-items:center; gap:6px; padding:11px 12px; box-shadow:0 1px 0 var(--line);}
  .dtop .bk{display:flex; align-items:center; gap:4px; font-size:15px; font-weight:600;
            color:var(--accent); cursor:pointer; padding:4px 6px;}
  .galwrap{background:var(--card);}
  .gallery{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;}
  .gallery::-webkit-scrollbar{display:none;}
  .gallery .slide{flex:0 0 100%; scroll-snap-align:center; height:46vh; max-height:380px;
                  display:flex; align-items:center; justify-content:center; background:var(--card);}
  .gallery .slide img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;}
  .gallery .slide .ph{font-size:64px;}
  .dots{display:flex; justify-content:center; gap:6px; padding:8px 0 2px;}
  .dot{width:6px; height:6px; border-radius:50%; background:#d0d0d6;}
  .dot.on{background:var(--accent); width:18px;}
  .dbody{padding:14px 16px 16px; background:var(--bg);}
  .dcard{background:var(--card); border-radius:16px; padding:14px 15px; box-shadow:var(--shadow);}
  .dprice{font-size:25px; font-weight:800; letter-spacing:-.5px;}
  .doldprice{font-size:15px; color:var(--hint); text-decoration:line-through; margin-left:8px; font-weight:500;}
  .dname{font-size:16.5px; font-weight:600; line-height:1.35; margin:8px 0 2px;}
  .drow{display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap;}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600;
        background:var(--bg); padding:6px 11px; border-radius:10px; color:#4a4a50;}
  .pill b{color:var(--star);}
  .pill.stock{color:var(--ok); background:#e8f8f0;}
  .pill.out{color:var(--sale); background:#fdebef;}
  .dsec{margin-top:14px;}
  .dsec h4{font-size:13px; color:var(--hint); font-weight:600; margin:0 0 6px; text-transform:uppercase; letter-spacing:.4px;}
  .ddesc{font-size:14.5px; line-height:1.55; white-space:pre-wrap; color:#2c2c30;}
  .buybar{position:sticky; bottom:0; margin-top:auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom));
          background:rgba(255,255,255,.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
          box-shadow:0 -1px 0 var(--line);}
  .buybar button{width:100%; padding:15px; border:none; border-radius:14px; font-size:16px;
              font-weight:700; color:#fff; cursor:pointer;
              background:linear-gradient(135deg,var(--accent),var(--accent-2));
              box-shadow:0 6px 18px rgba(112,0,255,.32); display:flex; align-items:center;
              justify-content:center; gap:8px; transition:.15s;}
  .buybar button:active{transform:scale(.98);}
  .buybar button:disabled{background:#c9c9d0; box-shadow:none; cursor:not-allowed;}
</style>
</head>
<body>
  <div class="topbar">
    <div class="searchwrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input class="search" id="search" placeholder="Mahsulot qidirish...">
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="content"></div>

  <div class="detail" id="detail">
    <div class="dtop">
      <div class="bk" id="backBtn">‹ Orqaga</div>
    </div>
    <div id="detailBody" style="flex:1; display:flex; flex-direction:column;"></div>
  </div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
try{ tg.setHeaderColor('#f2f3f5'); tg.setBackgroundColor('#f2f3f5'); }catch(e){}

const AUTH = "tma " + (tg.initData || "");
let activeCat = null, searchTimer = null, botUsername = null;

async function api(path){
  const r = await fetch(path, {headers:{Authorization: AUTH}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function money(v){ return Math.round(v||0).toLocaleString('ru-RU').replace(/,/g,' ') + " so'm"; }
function imgUrl(fid){ return "/api/image/" + encodeURIComponent(fid); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rating(p){ return (p.prod_avg_rating || p.avg_rating || 0); }
function reviews(p){ return (p.prod_review_count || p.review_count || 0); }
function oldPrice(p){ const o = p.old_price||p.price_old; return (o && o>p.price) ? o : null; }
function isNew(p){
  const d = p.created_at; if(!d) return false;
  const t = Date.parse(String(d).replace(' ','T')+'Z'); if(isNaN(t)) return false;
  return (Date.now()-t) < 7*864e5;
}

function starHtml(p){
  const r = rating(p);
  if(!r) return `<span class="stars" style="color:var(--hint)">Yangi</span>`;
  return `<span class="stars"><b>★</b> ${r.toFixed(1)}</span>`;
}

function cardHtml(p){
  const op = oldPrice(p);
  const img = p.image_url
    ? `<img src="${imgUrl(p.image_url)}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=ph>🖼️</div>'">`
    : `<div class="ph">🖼️</div>`;
  let tag = '';
  if(op) tag = `<span class="tag sale">CHEGIRMA</span>`;
  else if(isNew(p)) tag = `<span class="tag new">YANGI</span>`;
  return `<div class="card" data-id="${p.id}">
      <div class="imgwrap">${img}${tag}</div>
      <div class="body">
        <div><span class="price">${money(p.price)}</span>${op?`<span class="oldprice">${money(op)}</span>`:''}</div>
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${starHtml(p)} <span class="shopname">${esc(p.shop_name||'')}</span></div>
        <button class="buy" data-buy="${p.id}">🛒 Sotib olish</button>
      </div>
    </div>`;
}

function skeleton(){
  let s='';
  for(let i=0;i<6;i++) s+=`<div class="sk"><div class="skimg shimmer"></div>
    <div class="skl shimmer" style="width:60%"></div>
    <div class="skl shimmer" style="width:85%"></div>
    <div class="skl shimmer" style="width:40%;margin-bottom:11px"></div></div>`;
  return `<div class="grid">${s}</div>`;
}

async function loadCategories(){
  try{
    const cats = await api('/api/categories');
    const chips = document.getElementById('chips');
    chips.innerHTML = `<div class="chip active" data-cat="">Hammasi</div>` +
      cats.map(c=>`<div class="chip" data-cat="${c.id}">${c.emoji||''} ${esc(c.name)}</div>`).join('');
    chips.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
      chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      ch.classList.add('active');
      activeCat = ch.dataset.cat || null;
      try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
      loadProducts();
    });
  }catch(e){}
}

async function loadProducts(){
  const content = document.getElementById('content');
  content.innerHTML = skeleton();
  const q = document.getElementById('search').value.trim();
  let url = '/api/products?sort=rating';
  if(q) url += '&q=' + encodeURIComponent(q);
  if(activeCat) url += '&category_id=' + activeCat;
  try{
    const items = await api(url);
    if(!items.length){
      content.innerHTML = `<div class="empty"><span class="big">🔍</span>Hech narsa topilmadi<br><small>Boshqa so'rov yoki kategoriyani sinab ko'ring</small></div>`;
      return;
    }
    content.innerHTML = `<div class="grid">${items.map(cardHtml).join('')}</div>`;
    content.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
    content.querySelectorAll('[data-buy]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); orderInBot(b.dataset.buy); });
  }catch(e){
    content.innerHTML = `<div class="empty"><span class="big">⚠️</span>Xatolik: ${esc(e.message)}<br><small>Mini App'ni Telegram orqali oching.</small></div>`;
  }
}

async function openDetail(id){
  const detail = document.getElementById('detail');
  const body = document.getElementById('detailBody');
  body.innerHTML = `<div class="empty"><span class="big">⏳</span>Yuklanmoqda...</div>`;
  detail.classList.add('open');
  detail.scrollTop = 0;
  try{
    const p = await api('/api/products/'+id);
    const imgs = (p.images && p.images.length) ? p.images : (p.image_url?[p.image_url]:[]);
    const slides = imgs.length
      ? imgs.map(f=>`<div class="slide"><img src="${imgUrl(f)}" onerror="this.parentNode.innerHTML='<div class=ph>🖼️</div>'"></div>`).join('')
      : `<div class="slide"><div class="ph">🖼️</div></div>`;
    const dots = imgs.length>1
      ? `<div class="dots">${imgs.map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('')}</div>` : '';
    const op = oldPrice(p);
    const r = rating(p), rv = reviews(p);
    const stockOk = p.stock_count==null || p.stock_count>0;
    const stockPill = p.stock_count!=null
      ? (p.stock_count>0
          ? `<span class="pill stock">✓ Mavjud: ${p.stock_count} dona</span>`
          : `<span class="pill out">✕ Tugagan</span>`)
      : '';
    body.innerHTML = `
      <div class="galwrap"><div class="gallery" id="gallery">${slides}</div>${dots}</div>
      <div class="dbody">
        <div class="dcard">
          <div><span class="dprice">${money(p.price)}</span>${op?`<span class="doldprice">${money(op)}</span>`:''}</div>
          <div class="dname">${esc(p.name)}</div>
          <div class="drow">
            ${r?`<span class="pill"><b>★</b> ${r.toFixed(1)}${rv?` · ${rv} sharh`:''}</span>`:''}
            <span class="pill">🏪 ${esc(p.shop_name||'')}</span>
            ${stockPill}
          </div>
        </div>
        ${p.description?`<div class="dsec"><h4>Tavsif</h4><div class="dcard"><div class="ddesc">${esc(p.description)}</div></div></div>`:''}
      </div>
      <div class="buybar">
        <button id="buyBtn" ${stockOk?'':'disabled'}>${stockOk?'🛒 Buyurtma berish':'Hozircha mavjud emas'}</button>
      </div>`;
    if(stockOk) document.getElementById('buyBtn').onclick = ()=>orderInBot(p.id);
    // dots sinxronlash
    if(imgs.length>1){
      const g = document.getElementById('gallery');
      g.onscroll = ()=>{
        const i = Math.round(g.scrollLeft / g.clientWidth);
        body.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on', j===i));
      };
    }
  }catch(e){
    body.innerHTML = `<div class="empty"><span class="big">⚠️</span>Xatolik: ${esc(e.message)}</div>`;
  }
}

async function orderInBot(productId){
  try{ tg.HapticFeedback.impactOccurred('medium'); }catch(e){}
  if(!botUsername){
    try{ botUsername = (await api('/api/config')).bot_username; }catch(e){}
  }
  if(botUsername){
    tg.openTelegramLink(`https://t.me/${botUsername}?start=order_${productId}`);
    tg.close();
  }else{
    tg.showAlert("Buyurtma uchun botga qayting va mahsulotni tanlang.");
  }
}

function closeDetail(){ document.getElementById('detail').classList.remove('open'); }
document.getElementById('backBtn').onclick = closeDetail;
tg.BackButton && tg.onEvent('backButtonClicked', closeDetail);
document.getElementById('search').oninput = ()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(loadProducts,350); };

loadCategories();
loadProducts();
</script>
</body>
</html>
